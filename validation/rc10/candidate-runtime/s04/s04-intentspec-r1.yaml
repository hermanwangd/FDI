    question: "openSelectedChart 契約衝突的治理裁決（哪一契約為 canonical product truth）"
    status: unresolved
    note: "已在 RC10VAL-9 tracked（blocked，人類裁決）；不阻塞本 IntentSpec——r1 範圍（僅 src/interaction.js）內即可滿足 frozen test，治理裁決留給人類"
  - severity: NON_BLOCKING
    question: "chartLimits max=10（frozen 期望）vs 1000（seeded defect）裁決"
    status: unresolved
    note: "已在 RC10VAL-8 tracked；README 明定 r1 維持不變，與本 IntentSpec 範圍無衝突"
