      - id: scen:engcim-v06/chart-viewing/select-chart
        name: Select Chart
        behaviors:
          - action: 以 chartId 於圖表列表 selectChart(chartList, chartId)
            expected: "命中時回傳 { selectedChartId: <id>, action: 'SELECTED' }；查無時回傳 null"
            # 執行依據：ev:engcim-v06-exec-select-chart-01a0dd73（直接模組執行 {"selectedChartId":"chart-7","action":"SELECTED"}／null，非僅來源計數）
      - id: scen:engcim-v06/chart-viewing/render-chart
        name: Render Chart
        behaviors:
          - action: 以含 limits 的 config 呼叫 renderChart(config)
            expected: "回傳 { rendered: true, limits: config.limits }"
            # 執行依據：ev:engcim-v06-exec-render-chart-01a0dd73（直接模組執行 {"rendered":true,...}）
          - action: config 或 config.limits 缺失時呼叫 renderChart
            expected: 拋出 Error('INVALID_CHART_CONFIGURATION')
            # 執行依據：ev:engcim-v06-exec-render-chart-01a0dd73（直接模組執行拋 INVALID_CHART_CONFIGURATION）
