capabilities:
  - id: cap:engcim-v06/chart-viewing
    name: Chart Viewing
    description: 圖表檢視（執行驗證切片）：選取圖表、渲染圖表、檢視端回應分類——僅含經獨立執行驗證之非衝突行為；同 lineage 未裁決衝突內容保留於 sem:engcim-v06/chart-viewer（PROVISIONAL）。
